# Production on one server (see DEPLOY.md)
#   cp deploy/prod.env.example .env.prod   (then fill it in)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: erp-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.prod}
      POSTGRES_DB: erp
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No ports: the database is reachable only inside this Docker network.

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://erp:${DB_PASSWORD}@db:5432/erp
      SESSION_DAYS: ${SESSION_DAYS:-30}
      COOKIE_SECURE: "true"   # the site is reached over HTTPS (Cloudflare)
      APP_TIMEZONE: Asia/Ho_Chi_Minh
      SEED_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      SEED_ADMIN_NAME: ${ADMIN_NAME:-Quản trị viên}
      SEED_SAMPLE_DATA: "false"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Only this machine. Cloudflare Tunnel (below) reaches Caddy through the Docker network.
      - "127.0.0.1:${WEB_PORT:-8090}:80"

  # Cloudflare Tunnel: publishes the site without opening any port on the server.
  # Token: Cloudflare Zero Trust → Networks → Tunnels → Create tunnel → public hostname → http://web:80
  tunnel:
    image: cloudflare/cloudflared:latest  # after it works, pin a version from hub.docker.com/r/cloudflare/cloudflared/tags
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env.prod}
    depends_on:
      - web

  # Nightly database dump at 02:00, kept for 30 days in ./backups
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: erp
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: erp
      TZ: Asia/Ho_Chi_Minh
      KEEP_DAYS: 30
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]

volumes:
  db_data:
